set-option -g default-shell /bin/zsh
set-option -g focus-events on
set-option -g allow-passthrough on

# Clear Codex Deck attention only when a completed Codex pane is actually viewed.
set-hook -g pane-focus-in[100] 'run-shell -b "/usr/lib/streamcontroller/venv/bin/python $HOME/.dotfiles/config/streamdeck/codexdeck/manager.py acknowledge-focused-pane \"\" \"#{hook_pane}\""'
set-hook -g client-focus-in[100] 'run-shell -b "/usr/lib/streamcontroller/venv/bin/python $HOME/.dotfiles/config/streamdeck/codexdeck/manager.py acknowledge-focused-pane \"#{hook_client}\" \"#{hook_pane}\""'

# use C-a, since it's on the home row and easier to hit than C-b
unbind-key C-b
unbind-key C-a
set-option -g prefix C-a
bind-key C-a send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Enable hyperlinks everywhere and modern rendering features in the terminals I use.
set-option -sa terminal-features ",*:hyperlinks,xterm-ghostty:RGB:sync,st-256color:RGB"

# vi is good
set -g status-keys vi
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi V send -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi Enter send-keys -X copy-selection-and-cancel

## Set the word separators to get closer to vim's
set-option -g word-separators " -_()@.,[]{}:=\/"

# Use system clipboard for copy-pasting
set -g set-clipboard on

# mouse behavior
set -g mouse on

# Start windows and panes at 1, not 0 for easier navigation
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is killed.
set -g renumber-windows on

# Keep generous scrollback without letting tmux grow without bound.
set -g history-limit 200000

# Keep Escape responsive for Vim without conflicting overrides.
set -sg escape-time 10

# More keys to bind
set -s extended-keys on

# Theme sets the status line and pane colours.
set -g @onedark_widgets '#(python3 "$HOME/.dotfiles/config/tmux/reboot-required.py")'
if-shell -b '[ -r "$HOME/work/misc/tmux-onedark-theme/tmux-onedark-theme.tmux" ]' \
  'run-shell "$HOME/work/misc/tmux-onedark-theme/tmux-onedark-theme.tmux"'

# Keep native tmux popups aligned with the One Dark terminal theme.
# Newer development builds removed these options; -q skips them when absent.
set -gq popup-style "fg=#aab2bf,bg=#282c34"
set -gq popup-border-style "fg=#5c6370,bg=#282c34"

# Kitty-style hints for URLs, paths, SHAs, and other visible text.
set -g @fingers-enable-bindings 0
set -g @fingers-pattern-bazel-target '(^|[^A-Za-z0-9_:/.@+-])(?<match>(@@?[A-Za-z0-9_.+~-]+)?//[A-Za-z0-9_./+~-]*(?::[A-Za-z0-9_./+=,@~%*-]+)?)'
if-shell -b '[ -r "$HOME/.tmux/plugins/tmux-fingers/tmux-fingers.tmux" ]' \
  'run-shell "$HOME/.tmux/plugins/tmux-fingers/tmux-fingers.tmux"'
bind f if-shell -F '#{!=:#{@fingers-cli},}' \
  'run-shell -b "#{@fingers-cli} start #{pane_id}"' \
  'display-message "tmux-fingers is not installed"'
bind J if-shell -F '#{!=:#{@fingers-cli},}' \
  'run-shell -b "#{@fingers-cli} start #{pane_id} --mode jump"' \
  'display-message "tmux-fingers is not installed"'
bind u if-shell -F '#{!=:#{@fingers-cli},}' \
  'run-shell -b "#{@fingers-cli} start #{pane_id} --patterns url --main-action :open:"' \
  'display-message "tmux-fingers is not installed"'
bind B if-shell -F '#{!=:#{@fingers-cli},}' \
  'run-shell -b "#{@fingers-cli} start #{pane_id} --patterns bazel-target --main-action bazel-target-open\ open"' \
  'display-message "tmux-fingers is not installed"'
# Open visible file paths (including :line:column) beside the conversation.
set -g @fingers-pattern-editor-file '(?<![[:alnum:]_:/])(?<match>(?:~?/|[.]{1,2}/|[[:alnum:]_.-]+/)[^[:space:]()<>"{},;`]+)'
bind e if-shell -F '#{!=:#{@fingers-cli},}' {
  run-shell -b '#{@fingers-cli} start #{pane_id} --patterns editor_file --main-action "python3 $HOME/.dotfiles/config/tmux/open-file.py --pane #{pane_id} --window #{window_id}"'
} {
  display-message "tmux-fingers is not installed"
}
# q/s quotes terminal text as shell data, including empty strings and apostrophes.
bind -n C-MouseDown1Pane run-shell -b 'python3 "$HOME/.dotfiles/config/tmux/open-file.py" --pane #{mouse_pane} --hyperlink=#{q/s:mouse_hyperlink} --mouse-line=#{q/s:mouse_line} --mouse-column #{mouse_x} --mouse-row #{mouse_y} --scroll-position #{?scroll_position,#{scroll_position},0}'
bind -T copy-mode-vi C-MouseDown1Pane run-shell -b 'python3 "$HOME/.dotfiles/config/tmux/open-file.py" --pane #{mouse_pane} --hyperlink=#{q/s:mouse_hyperlink} --mouse-line=#{q/s:mouse_line} --mouse-column #{mouse_x} --mouse-row #{mouse_y} --scroll-position #{?scroll_position,#{scroll_position},0}'
bind -T copy-mode C-MouseDown1Pane run-shell -b 'python3 "$HOME/.dotfiles/config/tmux/open-file.py" --pane #{mouse_pane} --hyperlink=#{q/s:mouse_hyperlink} --mouse-line=#{q/s:mouse_line} --mouse-column #{mouse_x} --mouse-row #{mouse_y} --scroll-position #{?scroll_position,#{scroll_position},0}'
bind F command-prompt { find-window -Z "%%" }

# Renaming pane
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{s/sluongngoc/me/:#{d:pane_current_path}}/#{b:pane_current_path} | #{pane_current_command}'

# Switch back and forth between windows, screen-style.
# bind a last-window
# bind C-a last-window

# When opening a new window, use the CWD.
unbind c
bind c new-window -c "#{pane_current_path}"

# Use saner splitting commands.
unbind %
unbind '"'
bind l split-window -h -c "#{pane_current_path}"
bind j split-window -v -c "#{pane_current_path}"
