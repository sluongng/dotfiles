# Source of truth for shared Codex config: this file lives in ~/.dotfiles/config/codex/config.toml.
# automation/codex/install-codex.sh renders ${CODEX_HOME:-~/.codex}/config.toml from this file plus local overlays.
# Do not add [projects] here; machine-local trust entries belong in the selected Codex home's projects.local.toml.
# CLI configuration reviewed against installed codex-cli v0.155.0-alpha.3.7 on 2026-09-11.
# Shared App configuration is rendered here too; App runtime parity is checked separately.

model = "gpt-6-astra"
model_reasoning_effort = "high"
model_reasoning_summary = "none"
model_verbosity = "medium"
plan_mode_reasoning_effort = "xhigh"
show_raw_agent_reasoning = true

approval_policy = "never"
sandbox_mode = "danger-full-access"

web_search = "live"

project_doc_fallback_filenames = [
  "AGENTS.override.md",
  "CLAUDE.md",
  "OS.AGENTS.md",
]

suppress_unstable_features_warning = true
personality = "none"
service_tier = "default"
analytics.enabled = false
notify = ["/home/nb/.dotfiles/config/streamdeck/codexdeck/notify.py"]

[tools.experimental_request_user_input]
enabled = false

[features]
apply_patch_streaming_events = true
auth_elicitation = true
code_mode = true
code_mode_only = false
concurrent_reasoning_summaries = false
default_mode_request_user_input = false
goals = true
hooks = true
local_thread_store_compression = false
memories = true
mentions_v2 = true
personality = false
prevent_idle_sleep = true
# Opt-in CLI voice conversations; start explicitly with /voice in a new session.
realtime_conversation = true
runtime_metrics = true
# Keep these disabled on macOS and Linux. The CLI and Desktop share config but
# may ship different resource layouts, so packaged-fork support is not a safe
# cross-runtime assumption.
shell_zsh_fork = false
transcript_v2 = false
unified_exec = true

# Notes/history round trips verified with Astra parent and Luna/Terra/Sol roles.
# This selects the new context-reset path, not a legacy-compaction fallback.
# Start fresh tasks; leave thresholds to model defaults. astra-classic opts out.
# https://learn.chatgpt.com/docs/config-file/config-reference
[features.context_management]
experimental_mode = true

[features.current_time_reminder]
enabled = true
clock_source = "system"
delivery_mode = "after_user_or_tool_output"
sleep_tool = true

[features.multi_agent_v2]
enabled = true

[agents]
max_concurrent_threads_per_session = 6 # spawned agents; root thread is separate
max_depth = 2

[tui]
alternate_screen = "never"
notifications = false # Completion popups are emitted by the top-level notify hook.
status_line = ["model-with-reasoning", "project-root", "git-branch", "context-used", "five-hour-limit", "weekly-limit", "codex-version"]
session_picker_view = "dense"
terminal_title = ["thread-id"]

# Chrome DevTools MCP is intentionally not enabled in the shared or always-on
# local config. Configured MCP servers start during every Codex conversation;
# prefer the official Chrome plugin for an existing Chrome profile, or the
# built-in Browser for local web apps. For a deliberate Chrome DevTools session,
# temporarily enable the local ${CODEX_HOME:-~/.codex}/config.local.toml stanza.

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

# Keep desired state for tracked personal plugins here so regenerating the live
# config cannot discard installs made from the machine-local marketplace path.
[plugins."buildbuddy@sluongng-dotfiles"]
enabled = true

[plugins."buck2@sluongng-dotfiles"]
enabled = true

[plugins."codex-security-cloud@sluongng-dotfiles"]
enabled = true

[plugins."chatgpt-threads@sluongng-dotfiles"]
enabled = true

[plugins."tinytree-dev@sluongng-dotfiles"]
enabled = false
