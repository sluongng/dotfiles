# Source of truth for shared Codex config: this file lives in ~/.dotfiles/config/codex/config.toml.
# automation/codex/install-codex.sh renders ${CODEX_HOME:-~/.codex}/config.toml from this file plus local overlays.
# Do not add [projects] here; machine-local trust entries belong in the selected Codex home's projects.local.toml.
# Last reviewed for codex-cli v0.145.0-alpha.24 and current main on 2026-07-20.

model = "gpt-5.6-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "detailed"
plan_mode_reasoning_effort = "xhigh"
show_raw_agent_reasoning = true

approval_policy = "never"
sandbox_mode = "danger-full-access"

web_search = "live"

project_doc_fallback_filenames = [
  "AGENTS.override.md",
  "CLAUDE.md",
  "OS.AGENTS.md",
]

suppress_unstable_features_warning = true
personality = "none"
service_tier = "default"

[tools.experimental_request_user_input]
enabled = false

[features]
apply_patch_streaming_events = true
auth_elicitation = true
code_mode = true
code_mode_only = false
concurrent_reasoning_summaries = true
default_mode_request_user_input = false
enable_fanout = true
goals = true
local_thread_store_compression = true
memories = true
mentions_v2 = true
prevent_idle_sleep = true
remote_compaction_v2 = true
runtime_metrics = true
# The Homebrew cask should install Codex's package layout, including
# codex-resources/zsh/bin/zsh for the forked-zsh shell backend. Leave zsh_path
# unset so each installation can resolve its own packaged binary.
shell_zsh_fork = true
unified_exec = true
unified_exec_zsh_fork = true

[features.current_time_reminder]
enabled = true
clock_source = "system"
delivery_mode = "after_user_or_tool_output"
sleep_tool = true

[features.multi_agent_v2]
enabled = true

[agents]
max_concurrent_threads_per_session = 12 # spawned agents; root thread is separate
max_depth = 2

[tui]
alternate_screen = "never"
status_line = ["model-with-reasoning", "project-root", "git-branch", "context-used", "five-hour-limit", "weekly-limit", "codex-version"]
session_picker_view = "dense"

# Linux desktop trust entries kept here as comments on purpose.
# They are not meant to be active on this laptop.
#
#
#
#
#
#
# Chrome DevTools MCP is intentionally not enabled in the shared or always-on
# local config. Configured MCP servers start during every Codex conversation;
# prefer the codex-chrome-linux skill and Chrome Extension native host bridge
# for Linux Chrome control. For a deliberate Chrome DevTools MCP session,
# temporarily enable the local ${CODEX_HOME:-~/.codex}/config.local.toml stanza.

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

# Keep desired state for tracked personal plugins here so regenerating the live
# config cannot discard installs made from the machine-local marketplace path.
[plugins."buildbuddy@sluongng-dotfiles"]
enabled = true

[plugins."buck2@sluongng-dotfiles"]
enabled = true

[plugins."etoro-api@sluongng-dotfiles"]
enabled = false

[plugins."codex-security-cloud@sluongng-dotfiles"]
enabled = true

[plugins."chatgpt-threads@sluongng-dotfiles"]
enabled = true

[plugins."tinytree-dev@sluongng-dotfiles"]
enabled = false
